<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sensor Ambiental</title>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <main>
      <h1>🌿 Sensor Ambiental</h1>
      <section>
        <h2>📍 Información del Sensor</h2>
        <p><b>Nombre:</b> <span id="nombre">Cargando...</span></p>
        <p><b>Temperatura:</b> <span id="temp">-</span></p>
        <p><b>Humedad:</b> <span id="hum">-</span></p>
        <p><b>Presión:</b> <span id="pres">-</span></p>
        <p><b>Sensación térmica:</b> <span id="sensacion">-</span></p>
      </section>

      <section>
        <h2>📡 Estado de Red</h2>
        <p><b>IP:</b> <span id="ip">-</span></p>
        <p><b>RSSI:</b> <span id="rssi">-</span></p>
        <p><b>Estado:</b> <span id="estado_sensor">Calculando...</span></p>
        <p><b>Coordenadas:</b> <span id="coordenadas">-</span></p>
        <p><b>Firmware:</b> <span id="firmware">-</span></p>
      </section>

      <section>
        <h2>🌤️ Clima Exterior</h2>
        <p><b>Ubicación:</b> <span id="ubicacion_ext">-</span></p>
        <p><b>Temperatura:</b> <span id="temp_ext">-</span></p>
        <p><b>Humedad:</b> <span id="hum_ext">-</span></p>
        <p><b>Presión:</b> <span id="pres_ext">-</span></p>
      </section>
    </main>
    <script type="module" src="script.js"></script>
  </body>
</html>
